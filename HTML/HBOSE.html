<!DOCTYPE html>
<html lang="us">
<head>
    <meta charset="UTF-8">
    	<title>HBO se</title>
	<link href="jquery-ui.css" rel="stylesheet">
	<style>
	body{
		font-family: "Trebuchet MS", sans-serif;
		margin: 50px;
	}
	.demoHeaders {
		margin-top: 2em;
	}
	#dialog-link {
		padding: .4em 1em .4em 20px;
		text-decoration: none;
		position: relative;
	}
	#dialog-link span.ui-icon {
		margin: 0 5px 0 0;
		position: absolute;
		left: .2em;
		top: 50%;
		margin-top: -8px;
	}
	#icons {
		margin: 0;
		padding: 0;
	}
	#icons li {
		margin: 2px;
		position: relative;
		padding: 4px 0;
		cursor: pointer;
		float: left;
		list-style: none;
	}
	#icons span.ui-icon {
		float: left;
		margin: 0 4px;
	}
	.fakewindowcontain .ui-widget-overlay {
		position: absolute;
	}
	select {
		width: 200px;
	}
	</style>
</head>
<body>

<!-- Accordion -->
<h2 class="demoHeaders">Parameters</h2>
<div id="accordion">
	<h3>General</h3>
        <div> <!-- General tab contents-->
            <label>File name </label><input name="fileName" type="text">
            <br><br>
            <label>Period 1</label>
            <select id="period1">
                <option>m1</option>
                <option>m5</option>
                <option>H1</option>
                <option>H4</option>
                <option>D1</option>
                <option>W1</option>
		    </select>
             <br><br>
            <input type="checkbox" name="showP2" id="showP2">
            <label>Period 2</label>
            <select id="period1">
                <option>m1</option>
                <option>m5</option>
                <option>H1</option>
                <option>H4</option>
                <option>D1</option>
                <option>W1</option>
		    </select>

             <br><br>
             <input type="checkbox" name="showP3" id="showP3">
            <label>Period 3</label>
            <select id="period1">
                <option>m1</option>
                <option>m5</option>
                <option>H1</option>
                <option>H4</option>
                <option>D1</option>
                <option>W1</option>
		    </select>
            <br><br>
            <label>Processing mode</label>

            <input type="radio" id="historic" name="radio"><label for="radio1">Historic</label>
            <input type="radio" id="real_time" name="radio" checked="checked"><label for="radio2">Real time</label>
            <input type="radio" id="live_recorder" name="radio"><label for="radio3">Live recorder</label>
            <input type="radio" id="intra_bar" name="radio"><label for="radio4">Intra bar</label>
	</div>

	<h3>OHLC</h3>
	<div>
        <!-- Spinner -->
        <input type="checkbox" name="showOHLC" id="showOHLC">
        <label>OHLC lookback periods</label>
        <input  class="spinner"  id="spinnerOHLC" value="100" min="10" max="1000">

        <br><br>
        <input  type="checkbox" name="showOHLCDif" id="showOHLCDif">
        <label>OHLC lookback periods</label>
        <input class="spinner"  id="spinnerOHLCDiff" value="100" min="10" max="1000">
    </div>

	<h3>Post Processing</h3>
	<div>

        <input type="checkbox" name="stdz" id="stdz"><label>Standardize</label>
        <br><br>
        <input type="checkbox" name="ctgz" id="ctgz"><label>Catrgorize</label>
    </div>
</div>
<br><br>
<div>
    <button id="button">Generate output</button>
    <br><br>
    <div id="progressbar"></div>
</div>
<div class="ui-widget">
	<div class="ui-state-highlight ui-corner-all" style="margin-top: 20px; padding: 0 .7em;">
		<p><span class="ui-icon ui-icon-info" style="float: left; margin-right: .3em;"></span>
		<strong>Output file succesfully generated</strong> Sample ui-state-highlight style.</p>
	</div>
</div>


<!--JAVA SCRIPS-->

<script src="external/jquery/jquery.js"></script>
<script src="jquery-ui.js"></script>
<script>
<!--JAVA SCRIPS>
$( "#accordion" ).accordion();

var availableTags = [
	"ActionScript",
	"AppleScript",
	"Asp",
	"BASIC",
	"C",
	"C++",
	"Clojure",
	"COBOL",
	"ColdFusion",
	"Erlang",
	"Fortran",
	"Groovy",
	"Haskell",
	"Java",
	"JavaScript",
	"Lisp",
	"Perl",
	"PHP",
	"Python",
	"Ruby",
	"Scala",
	"Scheme"
];
$( "#autocomplete" ).autocomplete({
	source: availableTags
});



$( "#button" ).button();
$( "#button-icon" ).button({
	icon: "ui-icon-gear",
	showLabel: false
});



$( "#radioset" ).buttonset();



$( "#controlgroup" ).controlgroup();



$( "#tabs" ).tabs();



$( "#dialog" ).dialog({
	autoOpen: false,
	width: 400,
	buttons: [
		{
			text: "Ok",
			click: function() {
				$( this ).dialog( "close" );
			}
		},
		{
			text: "Cancel",
			click: function() {
				$( this ).dialog( "close" );
			}
		}
	]
});

// Link to open the dialog
$( "#dialog-link" ).click(function( event ) {
	$( "#dialog" ).dialog( "open" );
	event.preventDefault();
});



$( "#datepicker" ).datepicker({
	inline: true
});



$( "#slider" ).slider({
	range: true,
	values: [ 17, 67 ]
});



$( "#progressbar" ).progressbar({
	value: 20
});


$('.spinner').spinner();


$( "#menu" ).menu();



$( "#tooltip" ).tooltip();



$( "#selectmenu" ).selectmenu();


// Hover states on the static widgets
$( "#dialog-link, #icons li" ).hover(
	function() {
		$( this ).addClass( "ui-state-hover" );
	},
	function() {
		$( this ).removeClass( "ui-state-hover" );
	}
);
</script>
</body>
</html>
</body>
</html>
